on:
  workflow_dispatch:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  buidJob:
    name: buid
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@main
        with:
          submodules: recursive
#      https://github.com/actions/runner-images/blob/main/images/macos/macos-13-Readme.md#xcode
      - name: Show Xcode
        run: |
          xcode-select -p
          xcodebuild -version
      - name: Build macOS
        run: swift build
      - name: Build iOS
        run: swift build --sdk `xcrun -sdk iphonesimulator -show-sdk-path` -Xswiftc -target -Xswiftc x86_64-apple-ios13.0-simulator
      - name: Build tvOS
        run: swift build --sdk `xcrun -sdk appletvsimulator -show-sdk-path` -Xswiftc -target -Xswiftc x86_64-apple-tvos13.0-simulator
      - name: Build xrOS
        run: swift build --sdk `xcrun -sdk xrsimulator -show-sdk-path` -Xswiftc -target -Xswiftc x86_64-apple-xros1.0-simulator
      - name: Validate Kodi sample catalog
        run: swift test --filter KodiSampleCatalogTests/testCatalogContainsAllRequestedSamples
      - name: Test Kodi ProRes HDR MKV sample
        env:
          KODI_SAMPLE_URL: https://storage.googleapis.com/media.webmproject.org/devsite/vp9/hdr-encoding/strobe%5Fscientist.mkv
          KSPLAYER_KODI_SAMPLES_DIRECTORY: ${{ runner.temp }}/kodi-fixtures
          KSPLAYER_KODI_SAMPLE_IDS: prores-hdr-strobe-scientist
        run: |
          mkdir -p "$KSPLAYER_KODI_SAMPLES_DIRECTORY"
          ffprobe -v error -show_streams -of json "$KODI_SAMPLE_URL"
          ffmpeg -hide_banner -loglevel warning -y -ss 0 -i "$KODI_SAMPLE_URL" -t 3 -map 0 -c copy -avoid_negative_ts make_zero "$KSPLAYER_KODI_SAMPLES_DIRECTORY/prores-hdr-strobe-scientist-3s.mkv"
          swift test --filter KodiSampleCatalogTests/testSelectedLocalKodiSamplesOpen
      - name: Test
        run: swift test -v
